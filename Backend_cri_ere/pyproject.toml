[project]
name = "backend-cri-ere"
version = "0.1.0"
description = "backend fastapi pour le projet cri-ere qui est un site web pour un centre ecologique"
readme = "README.md"
authors = [
    { name = "Morand", email = "morandkentsa9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[project.scripts]
dev = "backend_cri_ere.main:start"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "pytest>=9.1.1",
]
