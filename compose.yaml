services:
  frontend-cri-ere:
    container_name: frontend-cri-ere
    image: frontend-cri-ere:v1
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    env_file:
      - ./frontend/.env
    depends_on:
      backend-cri-ere:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5173/", "--max-time", "2"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    
    dashboard-cri-ere:
      container_name: dashboard-cri-ere
      image: dashboard-cri-ere:v1
      build:
        context: ./dashboard
        dockerfile: docker/Dockerfile
      env_file:
        - ./dashboard/.env
      depends_on:
        backend-cri-ere:
          condition: service_healthy
      ports:
        - "${FRONTEND_PORT:-5174}:5174"
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:5174/", "--max-time", "2"]
        interval: 10s
        timeout: 3s
        retries: 5
        start_period: 10s
    
  backend-cri-ere: 
    container_name: backend-cri-ere
    image: backend-cri-ere:v1
    build:
      context: ./Backend_cri_ere
      dockerfile: docker/Dockerfile
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Backend CRI ERE}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:5173"]}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
volumes:
  mysql_data: